name: cprs

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  cprs-postgres:
    extends:
      file: config.yaml
      service: postgres-credentials
    image: postgres:18-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    restart: unless-stopped
    command: [postgres, -c, timezone=UTC, -c, log_timezone=UTC]
    environment:
      TZ: UTC
      POSTGRES_DB: codex_proxy
      POSTGRES_USER: codex_proxy
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    volumes:
      - type: bind
        source: ../.runtime/postgres
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U codex_proxy -d codex_proxy]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    logging: *json-logging

  cprs-redis:
    extends:
      file: config.yaml
      service: redis-credentials
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    restart: unless-stopped
    volumes:
      - type: bind
        source: ../.runtime/redis
        target: /data
        bind:
          create_host_path: false
    networks: [backend]
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    logging: *json-logging

  cprs:
    extends:
      file: config.yaml
      service: app-runtime
    image: ${CPR_IMAGE:-codex-proxy-rs:3.49.0-cprs.1}
    restart: unless-stopped
    user: '10001:10001'
    init: true
    stop_grace_period: 75s
    depends_on:
      cprs-postgres:
        condition: service_healthy
      cprs-redis:
        condition: service_healthy
    pids_limit: 256
    volumes:
      - type: bind
        source: ../.runtime/data
        target: /app/.runtime/data
        bind:
          create_host_path: false
      - type: bind
        source: ../.runtime/logs
        target: /app/.runtime/logs
        bind:
          create_host_path: false
    configs:
      - source: cpr_config
        target: /app/deploy/config.yaml
    networks: [backend, ingress]
    environment:
      HOME: /app
      CPR_SERVER_HOST: 0.0.0.0
      CPR_SERVER_PORT: '8080'
      CPR_DATABASE_URL: postgres://codex_proxy@cprs-postgres:5432/codex_proxy
      CPR_REDIS_URL: redis://cprs-redis:6379/
      CPR_DEPLOYMENT_MODE: docker
      CPR_UPDATE_EXE_PATH: /app/bin/codex-proxy-rs
      CPR_WEB_DIST_DIR: /app/web/dist
      CPR_ENABLE_SELF_RESTART: 'false'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ['/tmp:size=64m,mode=1777']
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
    logging: *json-logging

configs:
  cpr_config:
    file: ./config.yaml

networks:
  backend:
    internal: true
  ingress:
    external: true
    name: ${CPR_INGRESS_NETWORK:?Set CPR_INGRESS_NETWORK to the existing Caddy network}
